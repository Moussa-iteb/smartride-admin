<div class="panel" style="max-width: 600px; margin: 40px auto; padding: 32px;">
  <h2 class="panel-title">Send Notification</h2>
  <p class="panel-sub">Send push notification to users</p>

  <div class="form-group" style="margin-top: 24px;">
    <label>Target</label>
    <select [(ngModel)]="target" class="form-control">
      <option value="all">All Users</option>
      <option value="user">Specific User</option>
    </select>
  </div>

  <div class="form-group" *ngIf="target === 'user'">
    <label>User ID</label>
    <input type="number" [(ngModel)]="userId" class="form-control" placeholder="Enter user ID"/>
  </div>

  <div class="form-group">
    <label>Title</label>
    <input type="text" [(ngModel)]="title" class="form-control"
           placeholder="Ex: New Bike Available"/>
  </div>

  <div class="form-group">
    <label>Message</label>
    <textarea [(ngModel)]="body" class="form-control" rows="4"
              placeholder="Ex: A new bike is available near you!"></textarea>
  </div>

  <div style="display:flex; gap:12px; margin-top:16px;">
    <button class="btn-submit" (click)="send()" [disabled]="isLoading">
      {{ isLoading ? 'Sending...' : 'Send Notification' }}
    </button>
  </div>

  <div *ngIf="message" class="alert" [ngClass]="success ? 'alert-success' : 'alert-error'"
       style="margin-top:16px;">
    {{ message }}
  </div>
</div>
